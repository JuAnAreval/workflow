<div class="p-4">
    <h2 class="text-2xl font-bold mb-4 text-surface-900 dark:text-surface-0">Tareas del Proyecto</h2>

    <!-- Formulario para crear tarea -->
    <p-card header="Crear Nueva Tarea" class="mb-6">
        <form #taskForm="ngForm" (ngSubmit)="createTask(taskForm)" class="flex flex-col gap-4">
            <div class="flex flex-col gap-2">
                <label for="name" class="text-surface-700 dark:text-surface-300">Nombre de la Tarea</label>
                <input pInputText id="name" type="text" [(ngModel)]="newTask.name" name="name" required
                    placeholder="Ingresa el nombre de la tarea" class="w-full" />
            </div>
            <div class="flex flex-col gap-2">
                <label for="description" class="text-surface-700 dark:text-surface-300">Descripción</label>
                <textarea pTextarea id="description" [(ngModel)]="newTask.description" name="description" rows="3"
                    placeholder="Ingresa una descripción opcional" class="w-full"></textarea>
            </div>
            <div class="flex flex-col gap-2">
                <label for="estado" class="text-surface-700 dark:text-surface-300">Estado</label>
                <select id="estado" [(ngModel)]="newTask.estado" name="estado" class="w-full p-2 border border-surface-200 dark:border-surface-700 rounded" required>
                    <option value="" disabled>Selecciona el estado</option>
                    <option *ngFor="let option of statusOptions" [value]="option.value">{{ option.label }}</option>
                </select>
            </div>
            <p-button type="submit" label="Crear Tarea"></p-button>
        </form>
    </p-card>

    <!-- Lista de tareas -->
    <p-card header="Tareas Existentes">
        <div *ngIf="tasks.length > 0; else noTasks">
            <table class="w-full border-collapse border border-surface-200 dark:border-surface-700">
                <thead>
                    <tr class="bg-surface-100 dark:bg-surface-800">
                        <th class="border border-surface-200 dark:border-surface-700 p-2 text-left text-surface-900 dark:text-surface-0">Nombre</th>
                        <th class="border border-surface-200 dark:border-surface-700 p-2 text-left text-surface-900 dark:text-surface-0">Descripción</th>
                        <th class="border border-surface-200 dark:border-surface-700 p-2 text-left text-surface-900 dark:text-surface-0">Estado</th>
                        <th class="border border-surface-200 dark:border-surface-700 p-2 text-left text-surface-900 dark:text-surface-0">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let task of tasks">
                        <td class="border border-surface-200 dark:border-surface-700 p-2 text-surface-900 dark:text-surface-0">
                            <span *ngIf="!isEditing(task)">{{ task.name }}</span>
                            <input *ngIf="isEditing(task)" pInputText [(ngModel)]="editingTask.name" class="w-full" />
                        </td>
                        <td class="border border-surface-200 dark:border-surface-700 p-2 text-surface-600 dark:text-surface-400">
                            <span *ngIf="!isEditing(task)">{{ task.description }}</span>
                            <textarea *ngIf="isEditing(task)" pTextarea [(ngModel)]="editingTask.description" rows="2" class="w-full"></textarea>
                        </td>
                        <td class="border border-surface-200 dark:border-surface-700 p-2 text-surface-900 dark:text-surface-0">
                            <span *ngIf="!isEditing(task)">{{ task.estado }}</span>
                            <select *ngIf="isEditing(task)" [(ngModel)]="editingTask.estado" class="w-full p-1">
                                <option *ngFor="let option of statusOptions" [value]="option.value">{{ option.label }}</option>
                            </select>
                        </td>
                        <td class="border border-surface-200 dark:border-surface-700 p-2 text-surface-900 dark:text-surface-0">
                            <div class="flex gap-2">
                                <p-button *ngIf="!isEditing(task)" label="Editar" icon="pi pi-pencil" (onClick)="editTask(task)" size="small"></p-button>
                                <p-button *ngIf="isEditing(task)" label="Guardar" icon="pi pi-check" (onClick)="saveEdit()" size="small"></p-button>
                                <p-button *ngIf="isEditing(task)" label="Cancelar" icon="pi pi-times" severity="secondary" (onClick)="cancelEdit()" size="small"></p-button>
                                <p-button label="Eliminar" icon="pi pi-trash" (onClick)="deleteTask(task)" size="small" severity="danger"></p-button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <ng-template #noTasks>
            <p class="text-surface-500 dark:text-surface-400 mt-4">No hay tareas para este proyecto.</p>
        </ng-template>
    </p-card>
</div>
<p-confirmDialog></p-confirmDialog>
