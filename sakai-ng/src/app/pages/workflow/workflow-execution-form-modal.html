<p-dialog
  [visible]="visible"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [dismissableMask]="!isSubmitting"
  [closable]="!isSubmitting"
  [appendTo]="'body'"
  [baseZIndex]="12000"
  [style]="{ width: '42rem', maxWidth: '96vw' }"
  (onHide)="onHide()"
>
  <ng-template pTemplate="header">
    <span class="workflow-name-modal-title">
      Completar formulario: {{ title || 'Formulario' }}
    </span>
  </ng-template>

  <div class="workflow-name-modal-body">
    <div class="menu-intro">
      <p>
        Este workflow esta en pausa. Completa los campos para continuar la ejecucion.
      </p>
    </div>

    @if (statusMessage) {
      <p class="menu-empty">{{ statusMessage }}</p>
    }

    <div class="http-headers-block" style="max-height:46vh;overflow:auto;">
      @for (field of fields; track field.name + '-' + $index) {
        <label class="menu-field">
          <span>{{ field.name }}</span>
          <input
            type="text"
            class="menu-input"
            [value]="field.value"
            [disabled]="isSubmitting"
            (input)="onFieldInput($index, $event)"
            [placeholder]="'Valor para ' + field.name"
          />
        </label>
      }
    </div>
  </div>

  <ng-template pTemplate="footer">
    <p-button
      label="Cerrar"
      severity="secondary"
      [text]="true"
      [disabled]="isSubmitting"
      (onClick)="requestClose()"
    ></p-button>
    <p-button
      [label]="isSubmitting ? 'Guardando...' : 'Guardar y continuar'"
      [disabled]="isSubmitting"
      (onClick)="requestSubmit()"
    ></p-button>
  </ng-template>
</p-dialog>
